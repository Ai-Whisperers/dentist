name: Deploy to Cloudflare Pages

on:
  workflow_dispatch:
  push:
    branches: [master]
    paths:
      - '07_DESIGN/website/ometzdental.com.py/**'

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install wrangler
        run: npm install -g wrangler

      - name: Deploy to Cloudflare Pages
        env:
          CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
        run: |
          wrangler pages deploy 07_DESIGN/website/ometzdental.com.py \
            --project-name=ometzdental \
            --branch=master \
            --commit-dirty=true
