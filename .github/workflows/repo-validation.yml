name: repo-validation
on:
  push:
    paths:
      - "**.md"
      - "tools/**"
  pull_request:
    paths:
      - "**.md"
      - "tools/**"

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python tools/validate-refs.py all
