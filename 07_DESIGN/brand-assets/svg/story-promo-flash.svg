<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1920" width="1080" height="1920" role="img" aria-label="Story - Promo flash">
  <title>Story — Promo flash 24h</title>
  <defs>
    <linearGradient id="bg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#1A5F5A"/>
      <stop offset="100%" stop-color="#0F3D39"/>
    </linearGradient>
  </defs>

  <rect width="1080" height="1920" fill="url(#bg)"/>

  <!-- Decorative aleph -->
  <text x="540" y="650" text-anchor="middle" font-family="serif" font-size="400" fill="#B8860B" opacity="0.15" direction="rtl">אומץ</text>

  <!-- Top brand -->
  <text x="540" y="280" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="28" font-weight="500" fill="#FAFAF8" letter-spacing="10" opacity="0.85">OMETZ DENTAL</text>

  <!-- Big emoji -->
  <text x="540" y="900" text-anchor="middle" font-size="200">⚡</text>

  <!-- Headline -->
  <text x="540" y="1080" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="92" font-weight="800" fill="#FAFAF8">PROMO FLASH</text>
  <text x="540" y="1180" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="92" font-weight="800" fill="#B8860B">24 HORAS</text>

  <!-- Service -->
  <text x="540" y="1300" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="34" font-weight="500" fill="#FAFAF8" opacity="0.9">Profilaxis completa</text>

  <!-- Price -->
  <rect x="190" y="1360" width="700" height="180" rx="20" fill="#FAFAF8"/>
  <text x="540" y="1430" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="36" font-weight="500" fill="#2D2D2D" opacity="0.6">Solo hoy</text>
  <text x="540" y="1500" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="84" font-weight="800" fill="#1A5F5A">Gs 200.000</text>

  <!-- CTA -->
  <text x="540" y="1640" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="36" font-weight="700" fill="#FAFAF8">📱 Escribime al WhatsApp</text>
  <text x="540" y="1700" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="28" font-weight="500" fill="#B8860B">"PROMO" y te confirmo</text>

  <!-- Footer -->
  <text x="540" y="1840" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="400" fill="#FAFAF8" opacity="0.6">Válido solo hoy · Cupos limitados · @ometzdental</text>
</svg>