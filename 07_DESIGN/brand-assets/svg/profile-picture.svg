<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 200 200" width="200" height="200" role="img" aria-label="Ometz Dental profile photo">
  <title>Ometz Dental — Profile Picture</title>
  <desc>Profile photo for Facebook and WhatsApp Business: cream background with אומץ in terracotta.</desc>

  <rect width="200" height="200" fill="#FAFAF8"/>

  <!-- Decorative terracotta corner -->
  <path d="M 0 0 L 80 0 Q 60 60 0 80 Z" fill="#B8860B" opacity="0.15"/>
  <path d="M 200 200 L 120 200 Q 140 140 200 120 Z" fill="#B8860B" opacity="0.15"/>

  <!-- Centered אומץ -->
  <text x="100" y="115"
        text-anchor="middle"
        font-family="'Frank Ruhl Libre', 'David Libre', 'SBL Hebrew', serif"
        font-size="64"
        font-weight="700"
        fill="#B8860B"
        direction="rtl"
        unicode-bidi="bidi-override"
        letter-spacing="3">אומץ</text>

  <!-- Small wordmark below -->
  <text x="100" y="155"
        text-anchor="middle"
        font-family="'Montserrat', 'Inter', sans-serif"
        font-size="14"
        font-weight="700"
        fill="#1A5F5A"
        letter-spacing="3">OMETZ DENTAL</text>
</svg>