  <text x="540" y="1020" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="14" font-weight="500" fill="#FAFAF8" letter-spacing="4" opacity="0.7">@OMETZDENTAL · MBURUCUYÁ</text>
