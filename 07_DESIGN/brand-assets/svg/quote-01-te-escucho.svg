<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1080 1080" width="1080" height="1080" role="img" aria-label="Quote card 1 - Te escucho">
  <title>Quote — Te escucho</title>
  <rect width="1080" height="1080" fill="#1A5F5A"/>

  <!-- Decorative aleph pattern background -->
  <g opacity="0.06">
    <text x="-30" y="200" font-family="serif" font-size="180" fill="#FAFAF8" direction="rtl">א</text>
    <text x="850" y="500" font-family="serif" font-size="180" fill="#FAFAF8" direction="rtl">מ</text>
    <text x="-30" y="900" font-family="serif" font-size="180" fill="#FAFAF8" direction="rtl">ץ</text>
    <text x="850" y="1100" font-family="serif" font-size="180" fill="#FAFAF8" direction="rtl">א</text>
  </g>

  <!-- Top accent -->
  <line x1="440" y1="280" x2="640" y2="280" stroke="#B8860B" stroke-width="3"/>
  <text x="540" y="245" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="18" font-weight="500" fill="#B8860B" letter-spacing="8">OMETZ DENTAL</text>

  <!-- Main quote -->
  <text x="540" y="450" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="120" font-weight="700" fill="#FAFAF8">"Te escucho."</text>

  <!-- Subtitle -->
  <text x="540" y="540" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="32" font-weight="400" fill="#FAFAF8" opacity="0.85">Antes de mirar tu boca,</text>
  <text x="540" y="585" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="32" font-weight="400" fill="#FAFAF8" opacity="0.85">miro tu historia.</text>

  <!-- Divider -->
  <line x1="490" y1="700" x2="590" y2="700" stroke="#B8860B" stroke-width="2"/>

  <!-- Author -->
  <text x="540" y="755" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="22" font-weight="600" fill="#FAFAF8" letter-spacing="3">— DRA. GABRIELLA GONZÁLEZ PANE</text>

  <!-- Footer CTA -->
  <text x="540" y="880" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="22" font-weight="500" fill="#FAFAF8" opacity="0.9">📱 WhatsApp · Mburucuyá, Asunción</text>

  <!-- Bottom accent -->
  <text x="540" y="990" text-anchor="middle" font-family="serif" font-size="56" fill="#B8860B" direction="rtl">אומץ</text>
</svg>