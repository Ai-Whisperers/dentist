<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 200" width="800" height="200" role="img" aria-label="Ometz Dental horizontal logo">
  <title>Ometz Dental — Horizontal</title>
  <desc>Horizontal layout for website headers and email signatures.</desc>

  <rect width="800" height="200" fill="#FAFAF8"/>

  <!-- אומץ on left -->
  <text x="100" y="115"
        text-anchor="middle"
        font-family="'Frank Ruhl Libre', 'David Libre', 'SBL Hebrew', serif"
        font-size="72"
        font-weight="700"
        fill="#B8860B"
        direction="rtl"
        unicode-bidi="bidi-override"
        letter-spacing="4">אומץ</text>

  <!-- Vertical divider -->
  <line x1="200" y1="60" x2="200" y2="140" stroke="#1A5F5A" stroke-width="1.5" opacity="0.4"/>

  <!-- OMETZ DENTAL stacked -->
  <text x="225" y="92"
        font-family="'Montserrat', 'Inter', sans-serif"
        font-size="40"
        font-weight="700"
        fill="#1A5F5A"
        letter-spacing="6">OMETZ</text>

  <text x="225" y="125"
        font-family="'Montserrat', 'Inter', sans-serif"
        font-size="18"
        font-weight="500"
        fill="#2D2D2D"
        letter-spacing="10">DENTAL · Te escucho</text>
</svg>