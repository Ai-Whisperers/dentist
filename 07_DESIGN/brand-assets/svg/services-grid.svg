  <!-- Footer CTA -->
  <text x="540" y="1010" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="20" font-weight="500" fill="#1A5F5A">📱 +595 9XX XXX XXX · Mburucuyá, Asunción</text>
