<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 350 200" width="350" height="200" role="img" aria-label="Business card back">
  <title>Business Card — Back</title>
  <desc>Back side of business card with QR code to WhatsApp.</desc>

  <!-- Teal background -->
  <rect width="350" height="200" fill="#1A5F5A"/>

  <!-- Brand wordmark -->
  <text x="40" y="50" font-family="'Montserrat', sans-serif" font-size="18" font-weight="700" fill="#FAFAF8" letter-spacing="6">OMETZ</text>
  <text x="40" y="68" font-family="'Montserrat', sans-serif" font-size="11" font-weight="500" fill="#FAFAF8" letter-spacing="8">DENTAL</text>

  <!-- Decorative line -->
  <line x1="40" y1="80" x2="120" y2="80" stroke="#B8860B" stroke-width="1.5"/>

  <!-- Tagline -->
  <text x="40" y="105" font-family="'Montserrat', sans-serif" font-size="14" font-weight="400" font-style="italic" fill="#FAFAF8">Te escucho.</text>

  <!-- Services list -->
  <text x="40" y="135" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#FAFAF8" opacity="0.9">Segunda Opinión</text>
  <text x="40" y="150" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#FAFAF8" opacity="0.9">Planificación de Tratamientos</text>
  <text x="40" y="165" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#FAFAF8" opacity="0.9">Odontología Restauradora</text>
  <text x="40" y="180" font-family="'Montserrat', sans-serif" font-size="9" font-weight="500" fill="#FAFAF8" opacity="0.9">Estética Dental</text>

  <!-- QR Code placeholder (white square with pattern) -->
  <rect x="265" y="50" width="60" height="60" fill="#FAFAF8"/>
  <rect x="270" y="55" width="50" height="50" fill="#1A5F5A"/>
  <rect x="275" y="60" width="40" height="40" fill="#FAFAF8"/>
  <rect x="280" y="65" width="30" height="30" fill="#1A5F5A"/>
  <rect x="285" y="70" width="20" height="20" fill="#FAFAF8"/>
  <text x="295" y="125" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="6" font-weight="500" fill="#FAFAF8" letter-spacing="2">ESCANEAME</text>

  <!-- Web URL -->
  <text x="295" y="155" text-anchor="middle" font-family="'Montserrat', sans-serif" font-size="7" font-weight="500" fill="#B8860B">ometsdental.com.py</text>
  <text x="295" y="170" text-anchor="middle" font-family="serif" font-size="14" fill="#B8860B" direction="rtl">אומץ</text>
</svg>